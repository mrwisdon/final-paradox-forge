plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

def rc4ModId = 'ragecraft4reforged'
def rc4ModName = 'Ragecraft4: Reforged'
def rc4ModVersion = '0.1.0'
def rc4ModGroup = 'io.github.ragecraft4reforged'
def rc4ModAuthors = 'Local learning project'
def rc4ModDescription = "A Forge 1.20.1 recreation of Ragecraft IV's runeforging system and adventure-map content."

version = rc4ModVersion
group = rc4ModGroup

base {
    archivesName = rc4ModId
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${rc4ModId}" {
                    source sourceSets.main
                }
            }
        }

        client

        server {
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', rc4ModId, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'Illusive Soulworks'
        url = 'https://maven.theillusivec4.top/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: rc4ModId,
            mod_name: rc4ModName,
            mod_license: 'All Rights Reserved',
            mod_version: rc4ModVersion,
            mod_authors: rc4ModAuthors,
            mod_description: rc4ModDescription
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title': rc4ModId,
                'Specification-Vendor': rc4ModAuthors,
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor': rc4ModAuthors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def localModsDir = providers.gradleProperty('local_mods_dir').orNull
if (localModsDir != null && localModsDir != '') {
    tasks.register('syncLocalMods', Copy) {
        dependsOn tasks.named('reobfJar')
        from layout.buildDirectory.dir('libs')
        include "${rc4ModId}-${rc4ModVersion}.jar"
        into localModsDir
    }

    tasks.named('build') {
        finalizedBy 'syncLocalMods'
    }
}
